name: Release (APK + AppImage)

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      name: ${{ steps.v.outputs.name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          NAME="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    name: Build Android APKs
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate localization data
        run: dart localization/generator.dart

      - name: Enable in-app update check
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs to include the version
        run: |
          cd build/app/outputs/flutter-apk
          for f in *-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "harmonymusic-${{ needs.setup.outputs.version }}-${abi}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/harmonymusic-*.apk
          if-no-files-found: error

  build-appimage:
    name: Build Linux AppImage
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv libfuse2 \
            libayatana-appindicator3-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Generate localization data
        run: dart localization/generator.dart

      - name: Enable in-app update check
        run: echo "const updateCheckFlag = true;" > lib/utils/update_check_flag_file.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build AppImage
        run: |
          dart pub global activate flutter_distributor
          bash .github/scripts/patch-appimage-version.sh
          flutter_distributor package --platform linux --targets appimage

      - name: Verify AppImage exposes version (GearLever reads X-AppImage-Version)
        env:
          EXPECTED_VERSION: ${{ needs.setup.outputs.name }}
        run: |
          set -euo pipefail
          mapfile -t images < <(find dist -name '*.AppImage' -type f)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No AppImage found under dist/" >&2
            exit 1
          fi
          for img in "${images[@]}"; do
            echo "Checking $img (expect X-AppImage-Version=$EXPECTED_VERSION)"
            chmod +x "$img"
            tmpdir=$(mktemp -d)
            img_abs="$PWD/$img"
            (cd "$tmpdir" && "$img_abs" --appimage-extract '*.desktop' >/dev/null)
            desktop=$(find "$tmpdir/squashfs-root" -name '*.desktop' | head -1)
            if [ -z "$desktop" ]; then
              echo "No .desktop file extracted from $img" >&2
              rm -rf "$tmpdir"
              exit 1
            fi
            echo "--- $desktop ---"
            cat "$desktop"
            echo "--- end ---"
            grep -q "^X-AppImage-Version=${EXPECTED_VERSION}$" "$desktop"
            rm -rf "$tmpdir"
          done
          echo "All AppImages expose X-AppImage-Version=$EXPECTED_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/**/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [setup, build-apk, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove existing assets for this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.setup.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets -q '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
            done
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.name }}
          name: v${{ needs.setup.outputs.name }}
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/apk/*.apk
            artifacts/appimage/**/*.AppImage
